role: Assistant Professor of Finance
bio: |
  I am an Assistant Professor of Finance at the University of Minnesota's
  Carlson School of Management. My research is in macroeconomics and finance,
  with a focus on lifecycle household portfolios, inequality, and asset pricing.
  I earned my Ph.D. and M.A. in Economics from Stanford University, and an
  M.A. in Economics and B.S. in Mathematics & Economics from UCLA. You can reach me at
  [czadamj@umn.edu](mailto:czadamj@umn.edu).

